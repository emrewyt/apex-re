  </text>

  <!-- Decorative Separator -->
  <line x1="100" y1="268" x2="1040" y2="268" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Capabilities Pill Badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">
    <!-- Pill 1 -->
    <rect x="100" y="290" width="170" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="185" y="311" fill="#38BDF8" text-anchor="middle">Consensus Decompile</text>
    
    <!-- Pill 2 -->
    <rect x="285" y="290" width="180" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="375" y="311" fill="#34D399" text-anchor="middle">Dynamic Memory Diff</text>

    <!-- Pill 3 -->
    <rect x="480" y="290" width="175" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="567" y="311" fill="#A78BFA" text-anchor="middle">Kaitai Format Synth</text>

    <!-- Pill 4 -->
    <rect x="670" y="290" width="180" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="760" y="311" fill="#F472B6" text-anchor="middle">CFG Unflattening</text>

    <!-- Pill 5 -->
    <rect x="865" y="290" width="175" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="952" y="311" fill="#FBBF24" text-anchor="middle">Round-Trip Verified</text>
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="100" y="365" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">
    zero-hallucination decompilation · differential memory synthesis · symbolic constraint solving
  </text>
  <text x="1040" y="365" fill="#00D9F5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">
    v1.0.0 · Production Grade
  </text>
</svg>
