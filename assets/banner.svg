<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0A111F"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00D9F5"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="radial-glow" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#00D9F5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#radial-glow)"/>

  <!-- Matrix / Grid Pattern -->
  <g stroke="#00D9F5" stroke-opacity="0.05" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="440"/>
    <line x1="240" y1="0" x2="240" y2="440"/>
    <line x1="400" y1="0" x2="400" y2="440"/>
    <line x1="600" y1="0" x2="600" y2="440"/>
    <line x1="800" y1="0" x2="800" y2="440"/>
    <line x1="960" y1="0" x2="960" y2="440"/>
    <line x1="1120" y1="0" x2="1120" y2="440"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
  </g>

  <!-- Glassmorphic Main Frame -->
  <rect x="60" y="40" width="1080" height="360" rx="20" fill="url(#card-grad)" stroke="#00D9F5" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Hex Overlay in Corner -->
  <g fill="#00D9F5" fill-opacity="0.12" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">
    <text x="890" y="80">4D 5A 90 00 03 00 00 00</text>
    <text x="890" y="100">55 48 89 E5 48 83 EC 20</text>
    <text x="890" y="120">48 8D 05 A3 12 00 00 FF</text>
    <text x="890" y="140">E8 4B 01 00 00 90 C3 CC</text>
  </g>

  <!-- Status Chip -->
  <rect x="100" y="75" width="230" height="30" rx="15" fill="#00F5A0" fill-opacity="0.12" stroke="#00F5A0" stroke-opacity="0.4"/>
  <circle cx="118" cy="90" r="5" fill="#00F5A0"/>
  <text x="134" y="95" fill="#00F5A0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AUTONOMOUS RE ENGINE</text>

  <!-- Main Headline -->
  <text x="100" y="165" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    APEX<tspan fill="url(#cyber-cyan)">-RE</tspan>
  </text>

  <!-- Subtitle -->
  <text x="100" y="210" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="18" font-weight="600">
    Master-Tier Reverse Engineering Skill for AI Agents
  </text>
  
  <text x="100" y="240" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="14" font-weight="400">
