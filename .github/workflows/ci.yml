name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify CLI tools execution
        run: |
          python skills/apex-re/scripts/apex_triage.py --help
          python skills/apex-re/scripts/memory_diff.py --help
          python skills/apex-re/scripts/kaitai_synth.py --help
          python skills/apex-re/scripts/unflatten_trace.py --help
